services:
  - type: worker
    name: dmi-fn-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CHECK_INTERVAL_SECONDS
        value: "600"
      - key: SCAN_MAX_PAGES
        value: "2"
